<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMU Academy — SSB Wira Mekar Utama</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            wmu: {
              green: '#0e3d22',
              darkgreen: '#072413',
              lightgreen: '#1a5c36',
              gold: '#D4AF37',
              goldlight: '#FFF9E6'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAF9; }
    .gold-gradient { background: linear-gradient(135deg, #DFBA49 0%, #B89220 100%); }
    .green-gradient { background: linear-gradient(135deg, #0e3d22 0%, #072413 100%); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-gray-800 pb-28 antialiased selection:bg-yellow-500 selection:text-white">

  <!-- ==================== MODAL LOGIN (DENGAN FIX KLIK) ==================== -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-[#072413] flex flex-col justify-center px-4 py-6" style="display: flex;">
    <div class="max-w-md w-full mx-auto space-y-6">
      <div class="text-center space-y-1">
        <div class="w-16 h-16 mx-auto rounded-2xl gold-gradient flex items-center justify-center text-white font-black text-3xl shadow-xl border border-white">
          W
        </div>
        <h1 class="text-xl font-black text-white tracking-wide pt-2">WMU ACADEMY</h1>
        <p class="text-[11px] text-yellow-300 font-semibold uppercase tracking-widest">SSB Wira Mekar Utama</p>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-2xl space-y-4">
        <div>
          <h2 class="text-base font-bold text-gray-900">Masuk Portal SSB</h2>
          <p class="text-xs text-gray-500">Sentuh salah satu akun di bawah untuk masuk:</p>
        </div>

        <div class="grid grid-cols-2 gap-2.5 text-xs">
          <!-- Tombol Admin -->
          <button type="button" onclick="loginSebagai('admin')" class="p-3 rounded-xl bg-emerald-50 text-emerald-950 font-bold border-2 border-emerald-400 active:scale-95 text-center flex flex-col items-center gap-1 shadow-sm cursor-pointer">
            <span class="text-2xl">🛡️</span>
            <span class="font-black text-xs text-[#0e3d22]">Admin SSB</span>
            <span class="text-[9px] text-emerald-700">Akses Penuh Kelola</span>
          </button>

          <!-- Tombol Pelatih -->
          <button type="button" onclick="loginSebagai('pelatih')" class="p-3 rounded-xl bg-blue-50 text-blue-950 font-bold border-2 border-blue-400 active:scale-95 text-center flex flex-col items-center gap-1 shadow-sm cursor-pointer">
            <span class="text-2xl">📋</span>
            <span class="font-black text-xs text-blue-900">Pelatih</span>
            <span class="text-[9px] text-blue-700">Materi & Absensi</span>
          </button>

          <!-- Tombol Atlet -->
          <button type="button" onclick="loginSebagai('atlet')" class="p-3 rounded-xl bg-amber-50 text-amber-950 font-bold border border-amber-300 active:scale-95 text-center flex flex-col items-center gap-1 cursor-pointer">
            <span class="text-2xl">⚽</span>
            <span class="font-black text-xs text-amber-900">Atlet Siswa</span>
            <span class="text-[9px] text-amber-700">Jadwal & Profil</span>
          </button>

          <!-- Tombol Orang Tua -->
          <button type="button" onclick="loginSebagai('orangtua')" class="p-3 rounded-xl bg-purple-50 text-purple-950 font-bold border border-purple-300 active:scale-95 text-center flex flex-col items-center gap-1 cursor-pointer">
            <span class="text-2xl">👨‍👩‍👦</span>
            <span class="font-black text-xs text-purple-900">Orang Tua</span>
            <span class="text-[9px] text-purple-700">Tagihan & Raport</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== TOP HEADER ==================== -->
  <header class="green-gradient text-white sticky top-0 z-30 shadow-md border-b-2 border-yellow-500">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-full gold-gradient flex items-center justify-center text-white font-extrabold text-base shadow border border-white">
          W
        </div>
        <div>
          <h1 class="font-extrabold text-sm tracking-wide leading-tight">WMU ACADEMY</h1>
          <p class="text-[10px] text-yellow-300 font-semibold" id="header-user-role">Administrator</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <span id="badge-role-pill" class="text-[10px] bg-yellow-400 text-gray-950 font-bold px-2 py-0.5 rounded-full uppercase">
          ADMIN
        </span>
        <button type="button" onclick="bukaLayarLogin()" class="p-1.5 rounded-lg bg-red-600 text-white text-xs active:scale-95 transition" title="Ganti Akun">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== KONTEN UTAMA ==================== -->
  <main class="max-w-md mx-auto px-4 pt-3 space-y-4">

    <!-- ================= TAB 1: BERANDA ================= -->
    <div id="view-dashboard" class="space-y-4">
      <div class="green-gradient rounded-2xl p-4 text-white shadow-md relative overflow-hidden border border-yellow-500/30">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[11px] text-yellow-300 font-medium">Selamat Datang,</p>
            <h2 id="dashboard-user-name" class="text-base font-bold text-white">Budi Santoso (Admin)</h2>
            <p class="text-[11px] text-gray-200 mt-0.5">SSB Wira Mekar Utama</p>
          </div>
          <div class="text-right">
            <span class="inline-block text-[10px] font-bold px-2 py-1 bg-yellow-500 text-gray-950 rounded-lg">
              TAHUN 2026
            </span>
          </div>
        </div>
      </div>

      <!-- Tombol Pendaftaran Siswa (Khusus Admin) -->
      <div id="admin-quick-add-container">
        <button type="button" onclick="openModalTambahAtlet()" class="w-full py-3 px-4 bg-[#0e3d22] border-2 border-yellow-500 text-white rounded-2xl font-bold text-xs flex items-center justify-between shadow-md active:scale-98 transition">
          <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-lg bg-yellow-400 text-gray-950 flex items-center justify-center font-black">
              +
            </div>
            <div class="text-left">
              <p class="text-white text-xs font-bold leading-tight">Daftarkan Atlet Siswa Baru</p>
              <p class="text-[10px] text-gray-300 font-normal">Input biodata, kelompok umur & wali</p>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-yellow-400"></i>
        </button>
      </div>

      <!-- Ringkasan Statistik -->
      <div class="grid grid-cols-2 gap-3">
        <div onclick="switchTab('atlet')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-3 cursor-pointer active:scale-95 transition">
          <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center">
            <i data-lucide="users" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="text-[10px] text-gray-500 font-medium">Total Atlet</p>
            <p id="stat-total-atlet" class="text-base font-bold text-gray-900 leading-tight">4 Siswa</p>
          </div>
        </div>

        <div onclick="switchTab('absensi')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-3 cursor-pointer active:scale-95 transition">
          <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
            <i data-lucide="clipboard-check" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="text-[10px] text-gray-500 font-medium">Presensi Hari Ini</p>
            <p id="stat-presensi-hari" class="text-base font-bold text-gray-900 leading-tight">100%</p>
          </div>
        </div>
      </div>

      <!-- Jadwal Terdekat -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2.5">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-gray-900 flex items-center gap-1.5">
            <i data-lucide="calendar" class="w-4 h-4 text-emerald-700"></i> Sesi Latihan Berikutnya
          </h3>
          <button type="button" onclick="switchTab('absensi'); switchSubTab('jadwal');" class="text-[10px] font-bold text-emerald-700 hover:underline">Lihat Semua</button>
        </div>
        <div id="dashboard-next-schedule" class="bg-gray-50 p-3 rounded-xl border border-gray-100 space-y-1">
          <!-- Disuntikkan JS -->
        </div>
      </div>
    </div>

    <!-- ================= TAB 2: ATLET ================= -->
    <div id="view-atlet" style="display: none;" class="space-y-3">
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
          <input type="text" id="search-atlet" oninput="filterAtlet()" placeholder="Cari nama atau posisi atlet..." class="w-full text-xs pl-9 pr-3 py-2.5 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#0e3d22]">
        </div>
        <button type="button" id="btn-tambah-atlet-tab" onclick="openModalTambahAtlet()" class="bg-[#0e3d22] text-white px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 active:scale-95 shadow border border-yellow-500">
          <i data-lucide="user-plus" class="w-4 h-4 text-yellow-400"></i>
          <span>+ Tambah</span>
        </button>
      </div>

      <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar text-xs">
        <button type="button" onclick="filterKU('SEMUA')" class="filter-ku-btn bg-[#0e3d22] text-white font-bold px-3 py-1.5 rounded-lg whitespace-nowrap">Semua KU</button>
        <button type="button" onclick="filterKU('KU-10')" class="filter-ku-btn bg-white text-gray-600 font-semibold px-3 py-1.5 rounded-lg border border-gray-200 whitespace-nowrap">KU-10</button>
        <button type="button" onclick="filterKU('KU-12')" class="filter-ku-btn bg-white text-gray-600 font-semibold px-3 py-1.5 rounded-lg border border-gray-200 whitespace-nowrap">KU-12</button>
        <button type="button" onclick="filterKU('KU-14')" class="filter-ku-btn bg-white text-gray-600 font-semibold px-3 py-1.5 rounded-lg border border-gray-200 whitespace-nowrap">KU-14</button>
      </div>

      <div id="list-atlet" class="space-y-2.5">
        <!-- Render otomatis -->
      </div>
    </div>

    <!-- ================= TAB 3: ABSENSI, JADWAL & MATERI ================= -->
    <div id="view-absensi" style="display: none;" class="space-y-4">
      
      <div class="grid grid-cols-3 bg-gray-200 p-1 rounded-xl text-xs font-bold text-gray-600">
        <button type="button" onclick="switchSubTab('absensi')" id="subtab-btn-absensi" class="py-2 rounded-lg bg-white text-[#0e3d22] shadow-sm">Presensi</button>
        <button type="button" onclick="switchSubTab('jadwal')" id="subtab-btn-jadwal" class="py-2 rounded-lg">Jadwal</button>
        <button type="button" onclick="switchSubTab('materi')" id="subtab-btn-materi" class="py-2 rounded-lg">Materi Drill</button>
      </div>

      <!-- Presensi -->
      <div id="subview-absensi" class="space-y-3">
        <div class="bg-white p-3.5 rounded-2xl border border-gray-100 flex items-center justify-between">
          <div>
            <h3 class="text-xs font-bold te
